name: Compose SDK

on:
  push:
    branches: [ "main" ]
    paths:
      - '*gradle**'
      - 'kotlin-js-store/yarn.lock'
      - 'kotlin-js-store/wasm/yarn.lock'
      - 'storyblok-compose/**'
      - '.github/workflows/storyblok-compose.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '*gradle**'
      - 'kotlin-js-store/yarn.lock'
      - 'kotlin-js-store/wasm/yarn.lock'
      - 'storyblok-compose/**'
      - '.github/workflows/storyblok-compose.yml'
  workflow_call:
concurrency:
  # Limit concurrency to 1 for PRs. 'main' concurrency isn't limited.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - target: :storyblok-compose:jvmTest
            os: ubuntu-latest
          - target: :storyblok-compose:testAndroidHostTest
            os: ubuntu-latest
          - target: :storyblok-compose:jsTest
            os: ubuntu-latest
          - target: :storyblok-compose:wasmJsTest
            os: ubuntu-latest
          - target: :storyblok-compose:macosArm64Test
            os: macos-latest
          - target: :storyblok-compose:iosSimulatorArm64Test
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v5
    - uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - run: ./gradlew ${{ matrix.target }}

  api-check:
    runs-on: ubuntu-latest
    if: github.repository == 'storyblok/storyblok-kotlin' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v5
    - run: ./gradlew :storyblok-compose:checkLegacyAbi || { exit_code=$?; printf "*** This commit changes the public API. If intentional run './gradlew :storyblok-compose:updateLegacyAbi' and commit updated files. ***"; exit $exit_code; }

  api-dump:
    runs-on: ubuntu-latest
    if: github.repository != 'storyblok/storyblok-kotlin' || github.ref != 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        # Fork branches cannot be checked out by name from the base repository, so fall back to the merge commit.
        ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v5
    - run: ./gradlew :storyblok-compose:updateLegacyAbi
    # The workflow token cannot push to fork branches, so auto-commit only same-repository changes and
    # fail fork pull requests that have stale dumps with instructions instead.
    - uses: stefanzweifel/git-auto-commit-action@v6
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      run: git diff --exit-code || { exit_code=$?; printf "*** This pull request changes the public API. Run './gradlew :storyblok-compose:updateLegacyAbi' and commit the updated files. ***"; exit $exit_code; }

