name: Ktor plugin

on:
  push:
    branches: [ "main" ]
    paths:
      - '*gradle**'
      - 'kotlin-js-store/yarn.lock'
      - 'kotlin-js-store/wasm/yarn.lock'
      - 'ktor-client-storyblok/**'
      - '.github/workflows/ktor-client-storyblok.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '*gradle**'
      - 'kotlin-js-store/yarn.lock'
      - 'kotlin-js-store/wasm/yarn.lock'
      - 'ktor-client-storyblok/**'
      - '.github/workflows/ktor-client-storyblok.yml'
  workflow_call:
concurrency:
  # Limit concurrency to 1 for PRs. 'main' concurrency isn't limited.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - target: :ktor-client-storyblok:jvmTest
            os: ubuntu-latest
          - target: :ktor-client-storyblok:linuxX64Test
            os: ubuntu-latest
          - target: :ktor-client-storyblok:testAndroidHostTest
            os: ubuntu-latest
          - target: :ktor-client-storyblok:jsTest
            os: ubuntu-latest
          - target: :ktor-client-storyblok:wasmJsTest
            os: ubuntu-latest
          - target: :ktor-client-storyblok:mingwX64Test
            os: windows-latest
          - target: :ktor-client-storyblok:macosArm64Test
            os: macos-latest
          - target: :ktor-client-storyblok:iosSimulatorArm64Test
            os: macos-latest
          - target: :ktor-client-storyblok:tvosSimulatorArm64Test
            os: macos-latest
          - target: :ktor-client-storyblok:watchosSimulatorArm64Test
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
    - uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - run: ./gradlew ${{ matrix.target }}

  api-check:
    runs-on: ubuntu-latest
    if: github.repository == 'storyblok/storyblok-kotlin' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
    - run: ./gradlew :ktor-client-storyblok:checkLegacyAbi || { exit_code=$?; printf "*** This commit changes the public API. If intentional run './gradlew :ktor-client-storyblok:updateLegacyAbi' and commit updated files. ***"; exit $exit_code; }

  api-dump:
    runs-on: ubuntu-latest
    if: github.repository != 'storyblok/storyblok-kotlin' || github.ref != 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        # git-auto-commit-action below pushes the refreshed ABI dump using these
        # credentials, so this job must keep them.
        persist-credentials: true
        # Fork branches cannot be checked out by name from the base repository, so fall back to the merge commit.
        ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
    - run: ./gradlew :ktor-client-storyblok:updateLegacyAbi
    # The workflow token cannot push to fork branches, so auto-commit only same-repository changes and
    # fail fork pull requests that have stale dumps with instructions instead.
    - uses: stefanzweifel/git-auto-commit-action@778341af668090896ca464160c2def5d1d1a3eb0 # v6.0.1
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      run: git diff --exit-code || { exit_code=$?; printf "*** This pull request changes the public API. Run './gradlew :ktor-client-storyblok:updateLegacyAbi' and commit the updated files. ***"; exit $exit_code; }

